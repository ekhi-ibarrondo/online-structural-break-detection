[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "breakdetect"
version = "1.0.0"
description = "Online structural-break detection: one score per point from a committee of ten models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.2",
    "numba==0.67.0",
    "llvmlite==0.49.0",
    "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
evaluate = ["pandas", "pyarrow"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["breakdetect*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
